name: Update Scholar Metrics

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: update-scholar-metrics
  cancel-in-progress: false

jobs:
  update-scholar-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Refresh Scholar metrics
        run: |
          python update_scholar_metrics.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add scholar_metrics.js
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update Scholar metrics [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 2
          done
          echo "Unable to push Scholar metrics after three attempts." >&2
          exit 1
