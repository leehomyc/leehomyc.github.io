name: Update GitHub Stars

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: update-github-stars
  cancel-in-progress: false

jobs:
  update-github-stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Refresh cached star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update_github_stars.mjs

      - name: Commit and publish changes
        run: |
          if git diff --quiet -- github_stars.json; then
            echo "Star counts have not changed."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github_stars.json
          git commit -m 'Update cached GitHub stars'

          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          exit 1
